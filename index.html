<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بازی حافظه تصویری</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
    {
      "imports": {
        "three": "https://esm.sh/three@0.160.0",
        "canvas-confetti": "https://esm.sh/canvas-confetti@1.9.2",
        "gsap": "https://esm.sh/gsap@3.12.2"
      }
    }
    </script>
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-white overflow-hidden font-sans antialiased selection:bg-blue-500/30">
    
    <!-- Visual Effects Layer -->
    <div class="fixed inset-0 pointer-events-none z-[60] opacity-10 bg-[url('bg_pattern_dots.png')] bg-repeat"></div>
    <div class="fixed inset-0 pointer-events-none z-[60] bg-[radial-gradient(circle_at_50%_-20%,rgba(59,130,246,0.15),transparent_70%)]"></div>
    <div class="fixed inset-0 pointer-events-none z-[60] ring-inset ring-1 ring-white/5"></div>

    <!-- Three.js Background Container -->
    <div id="bg-canvas-container" class="fixed inset-0 -z-10 pointer-events-none"></div>

    <!-- Splash Screen -->
    <div id="splash-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-slate-950 transition-opacity duration-1000">
        <img src="splash_logo.png" alt="Logo" class="w-32 h-32 mb-8 animate-pulse">
        <h1 class="text-3xl font-bold mb-2">بازی حافظه تصویری</h1>
        <p class="text-slate-400 mb-2">کاری از سید آروین موسوی</p>
        <div class="w-64 h-2 bg-slate-800 rounded-full overflow-hidden">
            <div id="loading-bar" class="h-full bg-blue-500 w-0 transition-all duration-300"></div>
        </div>
        <div class="text-slate-400 mt-3 text-sm">درحال بارگذاری</div>
    </div>

    <!-- Main Menu -->
    <div id="main-menu" class="hidden fixed inset-0 z-40 flex flex-col items-center justify-center p-6 text-center">
        <div class="glass p-8 rounded-3xl w-full max-w-sm border border-white/10 shadow-2xl backdrop-blur-xl">
            <h2 class="text-4xl font-black mb-10 text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">منوی اصلی</h2>
            
            <div class="space-y-4">
                <button id="btn-start" class="w-full py-4 bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 rounded-2xl font-bold text-xl shadow-lg transition-transform active:scale-95">شروع بازی</button>
                <button id="btn-settings" class="w-full py-4 bg-white/5 hover:bg-white/10 rounded-2xl font-bold text-xl border border-white/10 transition-all active:scale-95">تنظیمات</button>
            </div>

            <div class="mt-10 pt-6 border-t border-white/5">
                <a href="#" class="text-blue-400 text-sm underline decoration-blue-400/80 hover:opacity-90 transition-colors">ثبت تبلیغ @Arvinweb</a>
            </div>
        </div>
    </div>

    <!-- Difficulty Selection -->
    <div id="difficulty-menu" class="hidden fixed inset-0 z-40 flex flex-col items-center justify-center p-6">
        <div class="glass p-8 rounded-3xl w-full max-w-sm border border-white/10 shadow-2xl text-center">
            <h2 class="text-3xl font-bold mb-8">انتخاب سطح سختی</h2>
            <div class="grid gap-4">
                <button data-difficulty="easy" class="btn-diff p-4 rounded-xl bg-emerald-500/20 hover:bg-emerald-500/30 border border-emerald-500/30 transition-all">
                    <span class="block text-xl font-bold text-emerald-400">آسان</span>
                    <span class="text-sm opacity-60 text-emerald-100">۱۲ کارت (۳x۴)</span>
                </button>
                <button data-difficulty="medium" class="btn-diff p-4 rounded-xl bg-orange-500/20 hover:bg-orange-500/30 border border-orange-500/30 transition-all">
                    <span class="block text-xl font-bold text-orange-400">متوسط</span>
                    <span class="text-sm opacity-60 text-orange-100">۱۶ کارت (۴x۴)</span>
                </button>
                <button data-difficulty="hard" class="btn-diff p-4 rounded-xl bg-red-500/20 hover:bg-red-500/30 border border-red-500/30 transition-all">
                    <span class="block text-xl font-bold text-red-400">سخت</span>
                    <span class="text-sm opacity-60 text-red-100">۳۰ کارت (۵x۶)</span>
                </button>
            </div>
            <button id="btn-back-menu" class="mt-8 text-slate-400 hover:text-white transition-colors">بازگشت به منو</button>
        </div>
    </div>

    <!-- Settings Menu -->
    <div id="settings-menu" class="hidden fixed inset-0 z-40 flex flex-col items-center justify-center p-6">
        <div class="glass p-6 rounded-3xl w-full max-w-md border border-white/10 shadow-2xl overflow-y-auto max-h-[90vh]">
            <h2 class="text-2xl font-bold mb-6 text-center">تنظیمات گرافیکی</h2>
            
            <div class="mb-8 flex items-center justify-between bg-white/5 p-4 rounded-2xl border border-white/5">
                <label class="text-sm font-bold text-slate-300">پس‌زمینه متحرک (سه بعدی)</label>
                <button id="toggle-animated-bg" class="w-14 h-7 rounded-full bg-slate-700 relative transition-all duration-300 shadow-inner">
                    <div class="dot absolute left-1 top-1 bg-white w-5 h-5 rounded-full transition-transform duration-300 shadow-md"></div>
                </button>
            </div>

            <div class="mb-8">
                <label class="block text-sm text-slate-400 mb-3">طرح بافت پس‌زمینه</label>
                <div class="grid grid-cols-2 gap-3">
                    <div class="setting-opt-bg relative cursor-pointer group" data-bg="dots">
                        <img src="bg_pattern_dots.png" class="w-full h-20 object-cover rounded-xl border-2 border-transparent group-[.selected]:border-blue-500">
                        <span class="absolute bottom-2 right-2 text-xs bg-black/50 px-2 rounded">نقطه‌ای</span>
                    </div>
                    <div class="setting-opt-bg relative cursor-pointer group" data-bg="waves">
                        <img src="bg_pattern_waves.png" class="w-full h-20 object-cover rounded-xl border-2 border-transparent group-[.selected]:border-blue-500">
                        <span class="absolute bottom-2 right-2 text-xs bg-black/50 px-2 rounded">موج‌دار</span>
                    </div>
                </div>
            </div>

            <div class="mb-8">
                <label class="block text-sm text-slate-400 mb-3">طرح پشت کارت‌ها</label>
                <div class="grid grid-cols-3 gap-2">
                    <div class="setting-opt-card relative cursor-pointer group" data-card="classic">
                        <img src="card_back_classic.png" class="w-full aspect-square object-cover rounded-lg border-2 border-transparent group-[.selected]:border-blue-500">
                    </div>
                    <div class="setting-opt-card relative cursor-pointer group" data-card="modern">
                        <img src="card_back_modern.png" class="w-full aspect-square object-cover rounded-lg border-2 border-transparent group-[.selected]:border-blue-500">
                    </div>
                    <div class="setting-opt-card relative cursor-pointer group" data-card="abstract">
                        <img src="card_back_abstract.png" class="w-full aspect-square object-cover rounded-lg border-2 border-transparent group-[.selected]:border-blue-500">
                    </div>
                </div>
            </div>

            <button id="btn-save-settings" class="w-full py-4 bg-blue-600 rounded-2xl font-bold shadow-lg transition-transform active:scale-95">ذخیره و بازگشت</button>
        </div>
    </div>

    <!-- Win Modal -->
    <div id="win-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-6 bg-slate-950/80 backdrop-blur-sm">
        <div class="glass p-8 rounded-3xl w-full max-w-sm border border-white/20 shadow-2xl text-center">
            <div class="text-6xl mb-4">🏆</div>
            <h2 class="text-3xl font-bold mb-2">تبریک!</h2>
            <p class="text-slate-300 mb-6">شما تمام جفت‌ها را پیدا کردید.</p>
            
            <div class="bg-white/5 rounded-2xl p-4 mb-8 grid grid-cols-2 gap-4">
                <div>
                    <div class="text-xs text-slate-400">زمان</div>
                    <div id="final-time" class="text-xl font-bold">00:00</div>
                </div>
                <div>
                    <div class="text-xs text-slate-400">امتیاز</div>
                    <div id="final-score" class="text-xl font-bold">0</div>
                </div>
            </div>

            <button id="btn-win-close" class="w-full py-4 bg-blue-600 hover:bg-blue-500 rounded-2xl font-bold text-lg transition-all active:scale-95">بازگشت به منو</button>
        </div>
    </div>

    <!-- Game View -->
    <div id="game-view" class="hidden fixed inset-0 z-30 flex flex-col">
        <header class="p-4 flex justify-between items-center glass border-b border-white/10">
            <div class="flex items-center gap-4">
                <button id="btn-quit" class="p-2 bg-white/5 rounded-lg hover:bg-white/10 text-red-400">انصراف</button>
            </div>
            <div id="game-stats" class="flex gap-6">
                <div class="text-center">
                    <div class="text-xs text-slate-400">زمان</div>
                    <div id="timer" class="font-mono text-xl font-bold">00:00</div>
                </div>
                <div class="text-center">
                    <div class="text-xs text-slate-400">امتیاز</div>
                    <div id="score" class="font-mono text-xl font-bold">0</div>
                </div>
            </div>
        </header>
        
        <main class="flex-1 flex items-center justify-center p-4">
            <div id="card-grid" class="grid gap-2 sm:gap-4 max-w-4xl w-full h-full max-h-[70vh] items-center justify-center content-center">
                <!-- Cards injected here -->
            </div>
        </main>

        <div id="game-hint" class="p-4 text-center text-blue-400 font-bold animate-pulse">
            کارت‌ها رو به خاطر بسپار...
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
