<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بازی حافظه تصویری</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;900&display=swap');

        body {
            font-family: 'Vazirmatn', "Vazir", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif !important;
            font-weight: 400;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            background-color: #020617;
        }

        .glass {
            background-color: #0f172a; /* Solid fallback for older WebViews */
            background-color: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(8px); /* Even lower blur for better compatibility */
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 
                inset 0 1px 1px rgba(255, 255, 255, 0.1),
                0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .glow-border {
            position: relative;
        }

        .glow-border::after {
            content: '';
            position: absolute;
            inset: -1px;
            background: linear-gradient(45deg, transparent, rgba(59, 130, 246, 0.4), transparent);
            z-index: -1;
            border-radius: inherit;
            animation: border-glow 4s linear infinite;
        }

        @keyframes border-glow {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        #bg-canvas-container {
            background: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #0f172a 50%, #020617 100%);
        }

        .text-glow {
            text-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
        }

        .card-shine {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0) 100%);
            pointer-events: none;
            z-index: 5;
        }

        .btn-premium {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.8), rgba(37, 99, 235, 0.8));
            box-shadow: 0 0 20px rgba(37, 99, 235, 0.3);
            transition: all 0.3s ease;
        }

        .btn-premium:hover {
            box-shadow: 0 0 30px rgba(37, 99, 235, 0.5);
            transform: translateY(-2px);
        }

        /* Card Styles */
        .card-container {
            perspective: 1000px;
            width: 100%;
            height: 100%;
            min-height: 60px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-style: preserve-3d;
        }

        .card-container:hover .card-inner {
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
        }

        .card-container.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-container.matched {
            opacity: 0.4;
            pointer-events: none;
            transform: scale(0.92) rotate(2deg);
            filter: grayscale(0.6) brightness(0.8);
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .animate-float {
            animation: float 4s ease-in-out infinite;
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .card-front {
            background: #0f172a;
            transform: rotateY(180deg);
            border: 2px solid rgba(255,255,255,0.15);
            overflow: hidden;
        }

        .card-back {
            background-size: cover;
            background-position: center;
            border: 2px solid rgba(255,255,255,0.1);
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }

        .card-front img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Layout helpers for different grid sizes */
        .grid-cols-3 { grid-template-columns: repeat(3, 1fr); }
        .grid-cols-4 { grid-template-columns: repeat(4, 1fr); }
        .grid-cols-5 { grid-template-columns: repeat(5, 1fr); }
        .grid-cols-6 { grid-template-columns: repeat(6, 1fr); }
    </style>
</head>
<body class="bg-slate-950 text-white overflow-hidden font-sans antialiased selection:bg-blue-500/30">
    
    <!-- Visual Effects Layer -->
    <div class="fixed inset-0 pointer-events-none z-10 opacity-20 bg-[url('bg_pattern_dots.png')] bg-repeat"></div>
    <div class="fixed inset-0 pointer-events-none z-10 bg-[radial-gradient(circle_at_50%_-20%,rgba(59,130,246,0.15),transparent_70%)]"></div>
    <div class="fixed inset-0 pointer-events-none z-10 ring-inset ring-1 ring-white/5"></div>

    <!-- Three.js Background Container -->
    <div id="bg-canvas-container" class="fixed inset-0 z-0 pointer-events-none"></div>

    <!-- Splash Screen -->
    <div id="splash-screen" class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-slate-950 transition-opacity duration-1000">
        <img src="splash_logo.png" alt="Logo" class="w-32 h-32 mb-8 animate-pulse">
        <h1 class="text-3xl font-bold mb-2">بازی حافظه تصویری</h1>
        <p class="text-slate-400 mb-8">کاری از سید آروین موسوی</p>
        <div class="w-64 h-2 bg-slate-800 rounded-full overflow-hidden">
            <div id="loading-bar" class="h-full bg-blue-500 w-0 transition-all duration-300"></div>
        </div>
    </div>

    <!-- Main Menu -->
    <div id="main-menu" class="fixed inset-0 z-50 flex flex-col items-center justify-center p-6 text-center">
        <div class="glass p-8 rounded-3xl w-full max-w-sm border border-white/10 shadow-2xl backdrop-blur-xl">
            <h2 class="text-4xl font-black mb-10 text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">منوی اصلی</h2>
            
            <div class="space-y-4">
                <button id="btn-start" class="w-full py-4 bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 rounded-2xl font-bold text-xl shadow-lg transition-transform active:scale-95">شروع بازی</button>
                <button id="btn-settings" class="w-full py-4 bg-white/5 hover:bg-white/10 rounded-2xl font-bold text-xl border border-white/10 transition-all active:scale-95">تنظیمات</button>
            </div>

            <div class="mt-10 pt-6 border-t border-white/5">
                <a href="#" class="text-blue-400 text-sm underline decoration-blue-400/80 hover:opacity-90 transition-colors">ثبت تبلیغ <span class="text-blue-400">@Arvinweb</span></a>
            </div>
        </div>
    </div>

    <!-- Difficulty Selection -->
    <div id="difficulty-menu" class="hidden fixed inset-0 z-50 flex flex-col items-center justify-center p-6">
        <div class="glass p-8 rounded-3xl w-full max-w-sm border border-white/10 shadow-2xl text-center">
            <h2 class="text-3xl font-bold mb-8">انتخاب سطح سختی</h2>
            <div class="grid gap-4">
                <button data-difficulty="easy" class="btn-diff p-4 rounded-xl bg-emerald-500/20 hover:bg-emerald-500/30 border border-emerald-500/30 transition-all">
                    <span class="block text-xl font-bold text-emerald-400">آسان</span>
                    <span class="text-sm opacity-60 text-emerald-100">۱۲ کارت (۳x۴)</span>
                </button>
                <button data-difficulty="medium" class="btn-diff p-4 rounded-xl bg-orange-500/20 hover:bg-orange-500/30 border border-orange-500/30 transition-all">
                    <span class="block text-xl font-bold text-orange-400">متوسط</span>
                    <span class="text-sm opacity-60 text-orange-100">۱۶ کارت (۴x۴)</span>
                </button>
                <button data-difficulty="hard" class="btn-diff p-4 rounded-xl bg-red-500/20 hover:bg-red-500/30 border border-red-500/30 transition-all">
                    <span class="block text-xl font-bold text-red-400">سخت</span>
                    <span class="text-sm opacity-60 text-red-100">۳۰ کارت (۵x۶)</span>
                </button>
            </div>
            <button id="btn-back-menu" class="mt-8 text-slate-400 hover:text-white transition-colors">بازگشت به منو</button>
        </div>
    </div>

    <!-- Settings Menu -->
    <div id="settings-menu" class="hidden fixed inset-0 z-50 flex flex-col items-center justify-center p-6">
        <div class="glass p-6 rounded-3xl w-full max-w-md border border-white/10 shadow-2xl overflow-y-auto max-h-[90vh]">
            <h2 class="text-2xl font-bold mb-6 text-center">تنظیمات گرافیکی</h2>
            
            <div class="mb-8 flex items-center justify-between bg-white/5 p-4 rounded-2xl border border-white/5">
                <label class="text-sm font-bold text-slate-300">پس‌زمینه متحرک (سه بعدی)</label>
                <button id="toggle-animated-bg" class="w-14 h-7 rounded-full bg-slate-700 relative transition-all duration-300 shadow-inner">
                    <div class="dot absolute left-1 top-1 bg-white w-5 h-5 rounded-full transition-transform duration-300 shadow-md"></div>
                </button>
            </div>

            <div class="mb-8">
                <label class="block text-sm text-slate-400 mb-3">طرح بافت پس‌زمینه</label>
                <div class="grid grid-cols-2 gap-3">
                    <div class="setting-opt-bg relative cursor-pointer group" data-bg="dots">
                        <img src="bg_pattern_dots.png" class="w-full h-20 object-cover rounded-xl border-2 border-transparent group-[.selected]:border-blue-500">
                        <span class="absolute bottom-2 right-2 text-xs bg-black/50 px-2 rounded">نقطه‌ای</span>
                    </div>
                    <div class="setting-opt-bg relative cursor-pointer group" data-bg="waves">
                        <img src="bg_pattern_waves.png" class="w-full h-20 object-cover rounded-xl border-2 border-transparent group-[.selected]:border-blue-500">
                        <span class="absolute bottom-2 right-2 text-xs bg-black/50 px-2 rounded">موج‌دار</span>
                    </div>
                </div>
            </div>

            <div class="mb-8">
                <label class="block text-sm text-slate-400 mb-3">طرح پشت کارت‌ها</label>
                <div class="grid grid-cols-3 gap-2">
                    <div class="setting-opt-card relative cursor-pointer group" data-card="classic">
                        <img src="card_back_classic.png" class="w-full aspect-square object-cover rounded-lg border-2 border-transparent group-[.selected]:border-blue-500">
                    </div>
                    <div class="setting-opt-card relative cursor-pointer group" data-card="modern">
                        <img src="card_back_modern.png" class="w-full aspect-square object-cover rounded-lg border-2 border-transparent group-[.selected]:border-blue-500">
                    </div>
                    <div class="setting-opt-card relative cursor-pointer group" data-card="abstract">
                        <img src="card_back_abstract.png" class="w-full aspect-square object-cover rounded-lg border-2 border-transparent group-[.selected]:border-blue-500">
                    </div>
                </div>
            </div>

            <button id="btn-save-settings" class="w-full py-4 bg-blue-600 rounded-2xl font-bold shadow-lg transition-transform active:scale-95">ذخیره و بازگشت</button>
        </div>
    </div>

    <!-- Win Modal -->
    <div id="win-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-6 bg-slate-950/80 backdrop-blur-sm">
        <div class="glass p-8 rounded-3xl w-full max-w-sm border border-white/20 shadow-2xl text-center">
            <div class="text-6xl mb-4">🏆</div>
            <h2 class="text-3xl font-bold mb-2">تبریک!</h2>
            <p class="text-slate-300 mb-6">شما تمام جفت‌ها را پیدا کردید.</p>
            
            <div class="bg-white/5 rounded-2xl p-4 mb-8 grid grid-cols-2 gap-4">
                <div>
                    <div class="text-xs text-slate-400">زمان</div>
                    <div id="final-time" class="text-xl font-bold">00:00</div>
                </div>
                <div>
                    <div class="text-xs text-slate-400">امتیاز</div>
                    <div id="final-score" class="text-xl font-bold">0</div>
                </div>
            </div>

            <button id="btn-win-close" class="w-full py-4 bg-blue-600 hover:bg-blue-500 rounded-2xl font-bold text-lg transition-all active:scale-95">بازگشت به منو</button>
        </div>
    </div>

    <!-- Game View -->
    <div id="game-view" class="hidden fixed inset-0 z-40 flex flex-col">
        <header class="p-4 flex justify-between items-center glass border-b border-white/10">
            <div class="flex items-center gap-4">
                <button id="btn-quit" class="p-2 bg-white/5 rounded-lg hover:bg-white/10 text-red-400">انصراف</button>
            </div>
            <div id="game-stats" class="flex gap-6">
                <div class="text-center">
                    <div class="text-xs text-slate-400">زمان</div>
                    <div id="timer" class="font-mono text-xl font-bold">00:00</div>
                </div>
                <div class="text-center">
                    <div class="text-xs text-slate-400">امتیاز</div>
                    <div id="score" class="font-mono text-xl font-bold">0</div>
                </div>
            </div>
        </header>
        
        <main class="flex-1 flex items-center justify-center p-4">
            <div id="card-grid" class="grid gap-2 sm:gap-4 max-w-4xl w-full h-full max-h-[70vh] items-center justify-center content-center">
                <!-- Cards injected here -->
            </div>
        </main>

        <div id="game-hint" class="p-4 text-center text-blue-400 font-bold animate-pulse">
            کارت‌ها رو به خاطر بسپار...
        </div>
    </div>

    <script type="module">
        import * as THREE from 'https://esm.sh/three';
        import confetti from 'https://esm.sh/canvas-confetti';

        // --- Settings Module ---
        const getStorageItem = (key, fallback) => {
            try {
                const val = localStorage.getItem(key);
                return val !== null ? val : fallback;
            } catch (e) {
                return fallback;
            }
        };

        const settingsState = {
            bg: getStorageItem('game_bg', 'waves'),
            cardBack: getStorageItem('game_cardBack', 'classic'),
            animatedBg: getStorageItem('game_animatedBg', 'true') !== 'false'
        };

        function updateVisuals() {
            const bgUrl = settingsState.bg === 'dots' ? 'bg_pattern_dots.png' : 'bg_pattern_waves.png';
            document.body.style.backgroundImage = `url(${bgUrl})`;
            document.body.style.backgroundSize = 'cover';

            const canvas = document.getElementById('bg-canvas-container');
            if (canvas) {
                canvas.style.display = settingsState.animatedBg ? 'block' : 'none';
            }

            const toggleBtn = document.getElementById('toggle-animated-bg');
            if (toggleBtn) {
                toggleBtn.classList.toggle('bg-blue-600', settingsState.animatedBg);
                toggleBtn.classList.toggle('bg-slate-700', !settingsState.animatedBg);
                const dot = toggleBtn.querySelector('.dot');
                if (dot) {
                    dot.style.transform = settingsState.animatedBg ? 'translateX(28px)' : 'translateX(0)';
                }
            }

            document.querySelectorAll('.setting-opt-bg').forEach(opt => {
                opt.classList.toggle('selected', opt.dataset.bg === settingsState.bg);
            });
            document.querySelectorAll('.setting-opt-card').forEach(opt => {
                opt.classList.toggle('selected', opt.dataset.card === settingsState.cardBack);
            });
        }

        function saveSettings(newSettings) {
            Object.assign(settingsState, newSettings);
            try {
                localStorage.setItem('game_bg', settingsState.bg);
                localStorage.setItem('game_cardBack', settingsState.cardBack);
                localStorage.setItem('game_animatedBg', settingsState.animatedBg);
            } catch (e) {
                console.warn("Settings could not be saved to local storage");
            }
            updateVisuals();
        }

        // --- Audio Module ---
        let audioCtx = null;
        const audioCache = {};

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        async function playSound(key) {
            const ctx = getAudioContext();
            if (ctx.state === 'suspended') {
                await ctx.resume();
            }

            if (audioCache[key]) {
                const source = ctx.createBufferSource();
                source.buffer = audioCache[key];
                source.connect(ctx.destination);
                source.start(0);
                return;
            }

            try {
                const response = await fetch(`${key}.mp3`);
                const arrayBuffer = await response.arrayBuffer();
                const audioBuffer = await new Promise((resolve, reject) => {
                    ctx.decodeAudioData(arrayBuffer, resolve, reject);
                });
                
                audioCache[key] = audioBuffer;
                const source = ctx.createBufferSource();
                source.buffer = audioBuffer;
                source.connect(ctx.destination);
                source.start(0);
            } catch (e) {
                console.warn("Audio play error for " + key, e);
            }
        }

        // --- Navigation Module ---
        let screens = {};
        let onBackCallback = null;

        function initNavigation(callback) {
            screens = {
                mainMenu: document.getElementById('main-menu'),
                difficulty: document.getElementById('difficulty-menu'),
                settings: document.getElementById('settings-menu'),
                game: document.getElementById('game-view'),
                win: document.getElementById('win-modal')
            };

            onBackCallback = callback;
            
            window.addEventListener('hashchange', (e) => {
                const hash = location.hash.replace('#', '') || 'mainMenu';
                applyScreenVisibility(hash);
                if (onBackCallback) onBackCallback(hash);
            });

            const currentHash = location.hash.replace('#', '') || 'mainMenu';
            applyScreenVisibility(currentHash);

            if (!location.hash || location.hash === '#') {
                try {
                    history.replaceState(null, '', '#mainMenu');
                } catch(e) {
                    location.hash = 'mainMenu';
                }
            }
        }

        function showScreen(screenKey, push = true) {
            const current = location.hash.replace('#', '') || 'mainMenu';
            if (current === screenKey) return;

            const screenEl = screens[screenKey];
            if (screenEl) {
                gsap.fromTo(screenEl, 
                    { opacity: 0, scale: 0.95, y: 10 },
                    { opacity: 1, scale: 1, y: 0, duration: 0.4, ease: "power2.out" }
                );
            }

            if (push) {
                location.hash = screenKey;
            } else {
                history.replaceState(null, '', `#${screenKey}`);
                applyScreenVisibility(screenKey);
            }
        }

        function applyScreenVisibility(screenKey) {
            Object.keys(screens).forEach(key => {
                const element = screens[key];
                if (!element) return;
                
                if (key === screenKey) {
                    element.classList.remove('hidden');
                    if (['win', 'mainMenu', 'difficulty', 'settings'].includes(key)) {
                        element.classList.add('flex');
                    }
                } else {
                    element.classList.add('hidden');
                    element.classList.remove('flex');
                }
            });

            try {
                if (window.Eitaa && Eitaa.WebApp && Eitaa.WebApp.BackButton) {
                    if (screenKey === 'mainMenu' || screenKey === 'splash') {
                        Eitaa.WebApp.BackButton.hide();
                    } else {
                        Eitaa.WebApp.BackButton.show();
                    }
                }
            } catch (e) {}
        }

        function getCurrentScreen() {
            const hash = location.hash.replace('#', '');
            return screens[hash] ? hash : 'mainMenu';
        }

        // --- Game Logic ---
        const gameState = {
            difficulty: 'easy',
            score: 0,
            time: 0,
            timerInterval: null,
            flippedCards: [],
            isProcessing: false,
            matchesFound: 0,
            totalPairs: 0,
            imageCount: 15
        };

        function setupGame(difficulty) {
            gameState.difficulty = difficulty;
            const config = {
                easy: { rows: 3, cols: 4, previewTime: 3000 },
                medium: { rows: 4, cols: 4, previewTime: 4000 },
                hard: { rows: 6, cols: 5, previewTime: 6000 }
            }[difficulty];

            gameState.totalPairs = (config.rows * config.cols) / 2;
            gameState.matchesFound = 0;
            gameState.score = 0;
            gameState.time = 0;
            gameState.isProcessing = true;
            
            document.getElementById('score').textContent = '0';
            document.getElementById('timer').textContent = '00:00';
            
            generateGrid(config);

            const hint = document.getElementById('game-hint');
            hint.textContent = 'کارت‌ها رو به خاطر بسپار...';
            hint.classList.remove('hidden');

            setTimeout(() => {
                flipAllCards(true);
                setTimeout(() => {
                    flipAllCards(false);
                    gameState.isProcessing = false;
                    hint.textContent = 'حالا جفت‌ها رو پیدا کن!';
                    startTimer();
                    setTimeout(() => hint.classList.add('hidden'), 2000);
                }, config.previewTime);
            }, 500);
        }

        function generateGrid(config) {
            const grid = document.getElementById('card-grid');
            grid.innerHTML = '';
            grid.className = `grid gap-2 sm:gap-4 max-w-4xl w-full h-full max-h-[70vh] items-center justify-center content-center grid-cols-${config.cols}`;

            const allIndices = Array.from({length: gameState.imageCount}, (_, i) => i + 1);
            const selectedIndices = allIndices.sort(() => Math.random() - 0.5).slice(0, gameState.totalPairs);
            const deck = [...selectedIndices, ...selectedIndices].sort(() => Math.random() - 0.5);

            deck.forEach((imgIdx, idx) => {
                const card = document.createElement('div');
                card.className = 'card-container opacity-0 scale-50';
                card.dataset.id = imgIdx;
                card.innerHTML = `
                    <div class="card-inner shadow-2xl">
                        <div class="card-back overflow-hidden border-2 border-white/5" style="background-image: url(card_back_${settingsState.cardBack}.png)">
                            <div class="card-shine opacity-30"></div>
                        </div>
                        <div class="card-front bg-slate-900 border-2 border-blue-500/30">
                            <div class="card-shine opacity-20"></div>
                            <img src="card_${imgIdx}.png" alt="card" loading="lazy" class="w-[85%] h-[85%] object-contain drop-shadow-[0_0_15px_rgba(59,130,246,0.4)]">
                        </div>
                    </div>
                `;
                card.onclick = () => handleCardClick(card);
                grid.appendChild(card);
                
                gsap.to(card, {
                    opacity: 1,
                    scale: 1,
                    duration: 0.6,
                    delay: idx * 0.03,
                    ease: "back.out(1.7)"
                });
            });
        }

        function handleCardClick(card) {
            if (gameState.isProcessing || card.classList.contains('flipped') || card.classList.contains('matched')) return;

            playSound('click');
            card.classList.add('flipped');
            gameState.flippedCards.push(card);

            if (gameState.flippedCards.length === 2) {
                checkMatch();
            }
        }

        function checkMatch() {
            gameState.isProcessing = true;
            const [card1, card2] = gameState.flippedCards;
            
            if (card1.dataset.id === card2.dataset.id) {
                setTimeout(() => {
                    playSound('match');
                    gsap.to([card1, card2], {
                        scale: 1.1,
                        duration: 0.2,
                        yoyo: true,
                        repeat: 1,
                        onComplete: () => {
                            card1.classList.add('matched');
                            card2.classList.add('matched');
                        }
                    });

                    gameState.matchesFound++;
                    gameState.score += 10;
                    document.getElementById('score').textContent = gameState.score;
                    gameState.flippedCards = [];
                    gameState.isProcessing = false;

                    if (gameState.matchesFound === gameState.totalPairs) {
                        winGame();
                    }
                }, 500);
            } else {
                setTimeout(() => {
                    playSound('error');
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    gameState.flippedCards = [];
                    gameState.isProcessing = false;
                }, 1000);
            }
        }

        function flipAllCards(show) {
            document.querySelectorAll('.card-container').forEach(card => {
                if (show) card.classList.add('flipped');
                else card.classList.remove('flipped');
            });
        }

        function startTimer() {
            stopTimer();
            gameState.timerInterval = setInterval(() => {
                gameState.time++;
                const mins = Math.floor(gameState.time / 60).toString().padStart(2, '0');
                const secs = (gameState.time % 60).toString().padStart(2, '0');
                document.getElementById('timer').textContent = `${mins}:${secs}`;
            }, 1000);
        }

        function stopTimer() {
            if (gameState.timerInterval) clearInterval(gameState.timerInterval);
        }

        function winGame() {
            stopTimer();
            playSound('win');
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
            
            setTimeout(() => {
                const finalTimeStr = document.getElementById('timer').textContent;
                document.getElementById('final-time').textContent = finalTimeStr;
                document.getElementById('final-score').textContent = gameState.score;
                showScreen('win', true);
            }, 500);
        }

        function clearGameState() {
            stopTimer();
            gameState.flippedCards = [];
            gameState.isProcessing = false;
        }

        // --- Main App Logic ---
        function startApp() {
            try {
                initNavigation((screenKey) => {
                    if (screenKey !== 'game') {
                        clearGameState();
                    }
                });
                updateVisuals();
                setupEventListeners();

                const unlockAudio = () => {
                    playSound('click'); 
                    document.removeEventListener('touchstart', unlockAudio);
                    document.removeEventListener('mousedown', unlockAudio);
                };
                document.addEventListener('touchstart', unlockAudio);
                document.addEventListener('mousedown', unlockAudio);

                preloadAssets();
                initLoading();

                setTimeout(() => {
                    const splash = document.getElementById('splash-screen');
                    if (splash && !splash.classList.contains('hidden')) {
                        splash.classList.add('opacity-0');
                        setTimeout(() => {
                            splash.classList.add('hidden');
                            showScreen('mainMenu', false);
                        }, 500);
                    }
                }, 4000);
                
                setTimeout(() => {
                    initBackground();
                    initEitaa();
                }, 100);

            } catch (err) {
                console.error("App boot failure:", err);
                const splash = document.getElementById('splash-screen');
                if (splash) splash.style.display = 'none';
                const menu = document.getElementById('main-menu');
                if (menu) {
                    menu.classList.remove('hidden');
                    menu.classList.add('flex');
                }
            }
        }

        function initEitaa() {
            try {
                if (window.Eitaa && Eitaa.WebApp) {
                    Eitaa.WebApp.ready();
                    if (Eitaa.WebApp.expand) Eitaa.WebApp.expand();
                    if (Eitaa.WebApp.onEvent) {
                        Eitaa.WebApp.onEvent('backButtonClicked', () => {
                            const current = getCurrentScreen();
                            if (current === 'mainMenu' || current === 'splash') {
                                Eitaa.WebApp.close();
                            } else {
                                playSound('click');
                                history.back();
                            }
                        });
                    }
                }
            } catch (e) {}
        }

        function preloadAssets() {
            const images = [
                'card_back_classic.png', 'card_back_modern.png', 'card_back_abstract.png',
                'bg_pattern_dots.png', 'bg_pattern_waves.png', 'splash_logo.png'
            ];
            for (let i = 1; i <= 15; i++) images.push(`card_${i}.png`);
            images.forEach(src => {
                const img = new Image();
                img.src = src;
            });
        }

        function initLoading() {
            const bar = document.getElementById('loading-bar');
            const splash = document.getElementById('splash-screen');
            if (!bar || !splash) return;

            let progress = 0;
            const interval = setInterval(() => {
                progress += 25 + Math.random() * 35;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    splash.classList.add('opacity-0');
                    splash.style.pointerEvents = 'none';
                    setTimeout(() => {
                        splash.classList.add('hidden');
                    }, 500);
                }
                bar.style.width = `${progress}%`;
            }, 50);
        }

        function initBackground() {
            const container = document.getElementById('bg-canvas-container');
            if (!container) return;

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: 'low-power' });
            renderer.setPixelRatio(1);
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            const createParticleLayer = (count, size, color, spread, speedMult) => {
                const cappedCount = Math.min(count, 1200);
                const geo = new THREE.BufferGeometry();
                const pos = new Float32Array(cappedCount * 3);
                const velocities = new Float32Array(cappedCount);
                const colors = new Float32Array(cappedCount * 3);
                const baseColor = new THREE.Color(color);

                for (let i = 0; i < cappedCount; i++) {
                    const i3 = i * 3;
                    pos[i3] = (Math.random() - 0.5) * spread;
                    pos[i3 + 1] = (Math.random() - 0.5) * spread;
                    pos[i3 + 2] = (Math.random() - 0.5) * spread;
                    velocities[i] = (Math.random() + 0.5) * speedMult;
                    colors[i3] = baseColor.r + (Math.random() - 0.5) * 0.2;
                    colors[i3 + 1] = baseColor.g + (Math.random() - 0.5) * 0.2;
                    colors[i3 + 2] = baseColor.b + (Math.random() - 0.5) * 0.2;
                }

                geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                const mat = new THREE.PointsMaterial({
                    size: size,
                    vertexColors: true,
                    transparent: true,
                    opacity: 0.85,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false
                });

                const points = new THREE.Points(geo, mat);
                points.userData = { velocities, spread, count: cappedCount };
                return points;
            };

            const layer1 = createParticleLayer(1200, 0.012, 0x3b82f6, 15, 0.0025);
            const layer2 = createParticleLayer(800, 0.02, 0x10b981, 20, 0.0045);
            const layer3 = createParticleLayer(60, 0.1, 0xffffff, 12, 0.01);

            scene.add(layer1, layer2, layer3);
            camera.position.z = 8;

            let targetX = 0, targetY = 0;
            window.addEventListener('pointermove', (e) => {
                targetX = (e.clientX - window.innerWidth / 2) / 450;
                targetY = (e.clientY - window.innerHeight / 2) / 450;
            });

            let running = true;
            let lastTime = 0;
            function animate(time) {
                if (!running) return;
                requestAnimationFrame(animate);

                if (document.hidden || !settingsState.animatedBg || container.style.display === 'none') {
                    if (time - lastTime < 250) return;
                }
                lastTime = time;

                const t = time * 0.00025;
                [layer1, layer2, layer3].forEach((layer, idx) => {
                    layer.rotation.y += 0.0006 * (idx + 1);
                    layer.rotation.z += 0.0003 * (idx + 1);
                    const attr = layer.geometry.attributes.position;
                    const pos = attr.array;
                    const count = layer.userData.count;
                    const step = count > 800 ? 4 : 1;
                    for (let i = 0; i < count * 3; i += 3 * step) {
                        pos[i + 1] += Math.sin(t + i) * 0.0008;
                    }
                    attr.needsUpdate = true;
                });

                camera.position.x += (targetX - camera.position.x) * 0.05;
                camera.position.y += (-targetY - camera.position.y) * 0.05;
                camera.lookAt(scene.position);
                renderer.render(scene, camera);
            }

            const updateRunningState = () => {
                const shouldRun = settingsState.animatedBg && container.style.display !== 'none' && !document.hidden;
                if (shouldRun && !running) {
                    running = true;
                    requestAnimationFrame(animate);
                } else if (!shouldRun && running) {
                    running = false;
                }
            };

            document.addEventListener('visibilitychange', updateRunningState);
            setInterval(updateRunningState, 500);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            if (settingsState.animatedBg) {
                running = true;
                requestAnimationFrame(animate);
            } else {
                running = false;
            }
        }

        function setupEventListeners() {
            document.getElementById('btn-start').onclick = () => {
                playSound('click');
                showScreen('difficulty');
            };

            document.getElementById('btn-settings').onclick = () => {
                playSound('click');
                showScreen('settings');
            };

            document.getElementById('btn-back-menu').onclick = () => {
                playSound('click');
                showScreen('mainMenu');
            };

            document.getElementById('btn-save-settings').onclick = () => {
                playSound('click');
                showScreen('mainMenu');
            };

            document.getElementById('btn-quit').onclick = () => {
                playSound('click');
                showScreen('mainMenu');
            };

            document.querySelectorAll('.btn-diff').forEach(btn => {
                btn.onclick = () => {
                    playSound('click');
                    showScreen('game', true); 
                    setupGame(btn.dataset.difficulty);
                };
            });

            document.getElementById('btn-win-close').onclick = () => {
                playSound('click');
                showScreen('mainMenu');
            };

            document.querySelectorAll('.setting-opt-bg').forEach(opt => {
                opt.onclick = () => {
                    saveSettings({ bg: opt.dataset.bg });
                    playSound('click');
                };
            });

            document.querySelectorAll('.setting-opt-card').forEach(opt => {
                opt.onclick = () => {
                    saveSettings({ cardBack: opt.dataset.card });
                    playSound('click');
                };
            });

            document.getElementById('toggle-animated-bg').onclick = () => {
                playSound('click');
                saveSettings({ animatedBg: !settingsState.animatedBg });
            };
        }

        // Boot
        if (document.readyState === 'loading') {
            window.addEventListener('DOMContentLoaded', startApp);
        } else {
            startApp();
        }
    </script>
</body>
</html>
